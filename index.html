<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajan SMM Panel</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0;padding:10px}
.card{background:#fff;border-radius:15px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px #ddd}
.service{border:2px solid #eee;border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.service.active{border-color:#22c55e;background:#f0fdf4}
.price{color:green;font-weight:bold;font-size:20px}
input{width:95%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
.btn{background:#22c55e;color:#fff;border:none;width:100%;padding:15px;border-radius:12px;font-size:18px;font-weight:bold}
.qr{width:130px;display:block;margin:10px auto}
#order-details{display:none}
</style>
</head>
<body>

<div class="card">
<h2>1. Service Select Karo</h2>

<div class="service" onclick="selectService('Instagram Likes',5,this)">
👍 Instagram Likes<br><span class="price">₹5 = 1000 Likes</span>
</div>

<div class="service" onclick="selectService('Instagram Followers',10,this)">
👤 Instagram Followers<br><span class="price">₹10 = 1000 Followers</span>
</div>

<div class="service" onclick="selectService('Reel Views',1,this)">
👁️ Reel Views<br><span class="price">₹1 = 2000 Views</span>
</div>
</div>

<div class="card">
<h3>Payment QR</h3>
<img src="IMG-20261119-WA8608.jpg" class="qr">
<p style="text-align:center">QR scan karke payment karo</p>
</div>

<div class="card" id="order-details">
<h2>2. Order Details</h2>
<p id="selected-text" style="font-weight:bold;color:green"></p>
<input type="text" id="link" placeholder="Apni Reel / Profile Ka Link Yaha Paste Karo">
<input type="number" id="qty" placeholder="Quantity" value="2000" oninput="calc()">
<input type="text" id="utr" placeholder="Payment UTR / Transaction ID Daalo">
<h3>Total Price: <span id="total" style="color:green">₹1.00</span></h3>
<button class="btn" onclick="order()">✅ Payment Kar Diya - Order on WhatsApp</button>
<p style="text-align:center;color:#888">Order dabate hi WhatsApp khulega, bas Send dabana hai</p>
</div>

<script>
let rate = 1;
let sName = "";
function selectService(name, price, el){
  sName = name; rate = price;
  document.querySelectorAll('.service').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('order-details').style.display='block';
  document.getElementById('selected-text').innerText = "Selected: " + name;
  calc();
  // Sidha Order Details pe le jayega
  document.getElementById('order-details').scrollIntoView({behavior:'smooth'});
}
function calc(){
  let q = document.getElementById('qty').value || 0;
  let total = (q/1000)*rate;
  // Reel Views ke liye alag rate
  if(sName=='Reel Views'){ total = (q/2000)*1; }
  document.getElementById('total').innerText = "₹" + total.toFixed(2);
}
function order(){
  let link = document.getElementById('link').value;
  let qty = document.getElementById('qty').value;
  let utr = document.getElementById('utr').value;
  let total = document.getElementById('total').innerText;
  if(!link || !utr){ alert("Link aur UTR dono daalo bhai!"); return; }
  let msg = "NEW ORDER 🔥%0A Service: "+sName+"%0A Link: "+link+"%0A Quantity: "+qty+"%0A Total: "+total+"%0A UTR: "+utr+"%0A Payment Done ✅";
  window.open("https://wa.me/91XXXXXXXXXX?text="+msg, "_blank");
}
</script>
</body>
</html>
